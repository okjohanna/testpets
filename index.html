<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Todo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="gadget">
      <div class="gadget-art">
        <img
          id="gadget-shell"
          class="gadget-shell"
          alt=""
          aria-hidden="true"
          data-tauri-drag-region
        />

        <div class="notebook-screen" aria-label="Notebook">
          <img
            id="notebook-background"
            class="notebook-background"
            alt=""
            aria-hidden="true"
          />
          <div class="screen-content">
            <header class="notebook-head">
              <h1 id="notebook-title">Tasks</h1>
              <div class="wallet" title="Coins">
                <span class="coin" aria-hidden="true"></span>
                <span id="coins">0</span>
              </div>
            </header>

            <div class="pages">
              <section class="page page-tasks" id="page-tasks" aria-label="Tasks">
                <form id="task-form" class="task-form">
                  <input
                    id="task-input"
                    placeholder="Write a task..."
                    autocomplete="off"
                    aria-label="New task"
                  />
                  <button type="submit">+</button>
                </form>

                <ul id="task-list" class="task-list"></ul>
                <p class="empty" id="empty-tasks" hidden>Nothing written yet.</p>
                <span id="task-page-count" class="task-page-count" aria-live="polite">1 / 1</span>
              </section>

              <section class="page page-shop" id="page-shop" aria-label="Shop" hidden>
                <p class="page-message">Shop coming soon!</p>
              </section>

              <section class="page page-pets" id="page-pets" aria-label="Pets" hidden>
                <div id="pet-grid" class="pet-grid"></div>
                <p class="empty" id="empty-pets" hidden>No pets yet.</p>
              </section>
            </div>
          </div>
        </div>

        <button
          type="button"
          class="gadget-button button-shop"
          data-page="shop"
          aria-label="Open shop"
          aria-pressed="false"
        ><img alt="" aria-hidden="true" /></button>
        <button
          type="button"
          class="gadget-button button-pets"
          data-page="pets"
          aria-label="Open pets"
          aria-pressed="false"
        ><img alt="" aria-hidden="true" /></button>
        <button
          type="button"
          class="gadget-button button-tasks"
          data-page="tasks"
          aria-label="Back to tasks"
          aria-pressed="true"
        ><img alt="" aria-hidden="true" /></button>
        <button
          type="button"
          id="next-task-page"
          class="gadget-button button-next"
          aria-label="Next task page"
        ><img alt="" aria-hidden="true" /></button>
        <button
          type="button"
          id="previous-task-page"
          class="gadget-button button-previous"
          aria-label="Previous task page"
        ><img alt="" aria-hidden="true" /></button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
