<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Todo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!--
      The notebook.

      The window is frameless and transparent, so the page is drawn with CSS:
      paper colour, ruled lines and a torn top edge.

      `.page-edge` and `.notebook-head` are drag regions - they are the only
      places the player can grab the window to move it. Never put a button
      inside them, or the button will drag the window instead of clicking.
    -->
    <div class="notebook">
      <div class="page-edge" data-tauri-drag-region></div>

      <header class="notebook-head" data-tauri-drag-region>
        <h1>To&#8209;Do</h1>
        <div class="wallet" title="Coins">
          <span class="coin" aria-hidden="true"></span>
          <span id="coins">0</span>
        </div>
      </header>

      <main class="pages">
        <section class="page page-tasks" id="page-tasks" aria-label="Tasks">
          <h2 class="page-heading">Tasks</h2>
          <p class="empty" id="empty-tasks">Nothing written here yet.</p>
        </section>

        <section class="page page-pets" id="page-pets" aria-label="Pets" hidden>
          <h2 class="page-heading">Pets</h2>
          <p class="empty" id="empty-pets">No pets yet.</p>
        </section>
      </main>

      <footer class="notebook-foot">
        <button type="button" id="page-toggle" class="page-toggle">Pets</button>
      </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
