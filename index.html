<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Todo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <h1>🐾 Pet Todo</h1>
      <div class="wallet" title="Coins">
        <span class="coin-icon">🪙</span>
        <span id="coins">0</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel pets" aria-labelledby="pets-heading">
        <h2 id="pets-heading">Your pets</h2>
        <div id="pet-list" class="pet-list"></div>
      </section>

      <section class="panel tasks" aria-labelledby="tasks-heading">
        <div class="tasks-head">
          <h2 id="tasks-heading">Tasks</h2>
          <span id="todo-summary" class="todo-summary"></span>
        </div>

        <form id="todo-form" class="todo-form">
          <input
            id="todo-input"
            placeholder="What needs doing?"
            autocomplete="off"
            aria-label="New task"
          />
          <select id="todo-difficulty" aria-label="Difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
          <button type="submit">Add</button>
        </form>

        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-todos" class="empty">
          No tasks yet. Add one above &mdash; your pet wants XP.
        </p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
